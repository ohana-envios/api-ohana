services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ohana
      POSTGRES_PASSWORD: ohana_local_only
      POSTGRES_DB: ohana_dev
    ports:
      - "127.0.0.1:${OHANA_DB_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohana -d ohana_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev_data:
