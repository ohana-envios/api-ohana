services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      ZITADEL_ISSUER_URL: ${ZITADEL_ISSUER_URL:?ZITADEL_ISSUER_URL is required}
      ZITADEL_PROJECT_ID: ${ZITADEL_PROJECT_ID:?ZITADEL_PROJECT_ID is required}
      ZITADEL_WEB_CLIENT_IDS: ${ZITADEL_WEB_CLIENT_IDS:?ZITADEL_WEB_CLIENT_IDS is required}
      ZITADEL_API_CLIENT_ID: ${ZITADEL_API_CLIENT_ID:?ZITADEL_API_CLIENT_ID is required}
      ZITADEL_API_CLIENT_SECRET: ${ZITADEL_API_CLIENT_SECRET:?ZITADEL_API_CLIENT_SECRET is required}
    ports:
      - "127.0.0.1:${OHANA_API_PORT:?OHANA_API_PORT is required}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
